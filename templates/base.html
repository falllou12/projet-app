<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mes notes{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">🔒 Mes notes</a>
    <nav>
      {% if g.user %}
        <a href="{{ url_for('security') }}">Sécurité</a>
        <span class="who">{{ g.user['username'] }}</span>
        <form method="post" action="{{ url_for('logout') }}" class="inline">
          {{ logout_form.csrf_token }}
          <button type="submit" class="link">Déconnexion</button>
        </form>
      {% else %}
        <a href="{{ url_for('login') }}">Connexion</a>
        <a href="{{ url_for('register') }}">Inscription</a>
      {% endif %}
    </nav>
  </header>

  <main class="container">
    {% for category, msg in get_flashed_messages(with_categories=true) %}
      <p class="flash {{ category }}">{{ msg }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
