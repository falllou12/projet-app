# nginx = porte d'entrée : HTTPS, fichiers statiques, protections réseau.
# Image « nginx-unprivileged » : tourne SANS root, écoute sur 8080/8443.

# Rate limit global par IP (1re ligne de défense, avant même Flask)
limit_req_zone $binary_remote_addr zone=global:10m rate=20r/s;
limit_req_status 429;

# --- HTTP : redirige tout vers HTTPS ---
server {
    listen 8080;
    server_name _;
    server_tokens off;
    return 301 https://$host:8443$request_uri;
}

# --- HTTPS ---
server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    server_tokens off;                      # ne pas afficher la version de nginx

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;          # SSLv3, TLS 1.0 et 1.1 sont cassés
    ssl_prefer_server_ciphers off;          # recommandation Mozilla « intermediate »
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Anti-Slowloris : pas de connexion qui traîne
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;
    client_max_body_size 64k;               # comme MAX_CONTENT_LENGTH de Flask

    limit_req zone=global burst=40 nodelay;

    # Fichiers statiques servis directement par nginx (plus rapide)
    location /static/ {
        alias /usr/share/nginx/static/;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://app:8000;
        # $http_host = Host EXACT envoyé par le navigateur (avec le port :8443).
        # Avec $host (sans port), Flask-WTF refusait tous les formulaires :
        # « The referrer does not match the host ». Valeur venant du client →
        # filtrée côté Flask par TRUSTED_HOSTS.
        proxy_set_header Host $http_host;
        # ÉCRASE (ne complète pas) X-Forwarded-For : nginx est le premier
        # serveur, toute valeur envoyée par le client est donc falsifiée.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
